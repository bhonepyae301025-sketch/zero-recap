<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero Recap</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 22px;
      margin-top: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 17px;
    }

    .upload {
      border: 2px dashed #aaa;
      border-radius: 18px;
      padding: 22px 15px;
      text-align: center;
    }

    input[type="file"] {
      width: 100%;
      margin-top: 15px;
    }

    video {
      width: 100%;
      border-radius: 15px;
      margin-top: 15px;
      display: none;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 25px;
      border: none;
      border-radius: 14px;
      background: #16803c;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    button:disabled {
      background: #999;
    }

    .progress-box {
      display: none;
      margin-top: 25px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .progress {
      width: 100%;
      height: 14px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #16803c;
      border-radius: 20px;
      transition: width .4s;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      color: #555;
      line-height: 1.6;
    }

    .result {
      display: none;
      margin-top: 25px;
      padding: 18px;
      background: #f0fdf4;
      border-radius: 15px;
      text-align: center;
    }

    .download {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      background: #16803c;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .error {
      color: #d32f2f;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">
      🚀 Zero Recap
    </div>

    <div class="subtitle">
      Video ကို AI Recap ပြုလုပ်ရန်
    </div>

    <!-- VIDEO UPLOAD -->
    <div class="upload">

      <strong>🎬 Video ရွေးပါ</strong>

      <input
        id="videoInput"
        type="file"
        accept="video/*"
      >

      <video id="preview" controls></video>

    </div>

    <!-- LANGUAGE -->
    <label>🌐 ဘာသာစကား</label>

    <select id="language">
      <option value="my">🇲🇲 မြန်မာ</option>
      <option value="en">🇺🇸 English</option>
    </select>

    <!-- VOICE -->
    <label>🎙️ အသံ</label>

    <select id="voice">
      <option value="female">👩 မိန်းကလေးအသံ</option>
      <option value="male">👨 ယောက်ျားလေးအသံ</option>
    </select>

    <!-- STYLE -->
    <label>🎨 ပုံစံ</label>

    <select id="style">
      <option value="natural">🗣️ သဘာဝပုံစံ</option>
      <option value="story">📖 Story ပုံစံ</option>
      <option value="news">📰 News ပုံစံ</option>
    </select>

    <button id="generateBtn" onclick="startRecap()">
      🚀 Recap Video ပြုလုပ်မယ်
    </button>

    <!-- PROGRESS -->
    <div class="progress-box" id="progressBox">

      <div class="progress-info">
        <span id="progressText">လုပ်ဆောင်နေသည်...</span>
        <strong id="percent">0%</strong>
      </div>

      <div class="progress">
        <div
          class="progress-bar"
          id="progressBar">
        </div>
      </div>

      <div class="status" id="status">
        ⏳ Video ကို Server သို့ ပို့နေသည်...
      </div>

    </div>

    <!-- RESULT -->
    <div class="result" id="result">

      <h3>✅ Recap Video ပြီးပါပြီ</h3>

      <p>
        ပြီးဆုံးပါပြီ။ အောက်ကခလုတ်ကနေ Video ကို ရယူနိုင်ပါတယ်။
      </p>

      <a
        id="downloadBtn"
        class="download"
        href="#"
        target="_blank"
        rel="noopener"
      >
        ⬇️ Video ရယူမယ်
      </a>

    </div>

  </div>

</div>


<script>

  /*
    ================================
    BACKEND API
    ================================
  */

  const API_BASE = "https://zero-recap.onrender.com";


  /*
    ================================
    ELEMENTS
    ================================
  */

  const videoInput =
    document.getElementById("videoInput");

  const preview =
    document.getElementById("preview");

  const generateBtn =
    document.getElementById("generateBtn");

  const progressBox =
    document.getElementById("progressBox");

  const progressBar =
    document.getElementById("progressBar");

  const percent =
    document.getElementById("percent");

  const progressText =
    document.getElementById("progressText");

  const statusText =
    document.getElementById("status");

  const result =
    document.getElementById("result");

  const downloadBtn =
    document.getElementById("downloadBtn");


  /*
    ================================
    VIDEO PREVIEW
    ================================
  */

  videoInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) {
      return;
    }

    const url = URL.createObjectURL(file);

    preview.src = url;
    preview.style.display = "block";

    result.style.display = "none";

    statusText.innerText =
      "✅ Video ရွေးပြီးပါပြီ။";

  });


  /*
    ================================
    PROGRESS
    ================================
  */

  function setProgress(value, text) {

    progressBar.style.width = value + "%";

    percent.innerText =
      value + "%";

    progressText.innerText =
      text;

  }


  /*
    ================================
    MAIN RECAP
    ================================
  */

  async function startRecap() {

    const file =
      videoInput.files[0];

    if (!file) {

      alert(
        "🎬 အရင်ဆုံး Video တစ်ခုရွေးပါ။"
      );

      return;
    }


    /*
      UI START
    */

    generateBtn.disabled = true;

    progressBox.style.display =
      "block";

    result.style.display =
      "none";

    setProgress(
      5,
      "Video ပြင်ဆင်နေသည်..."
    );


    try {

      /*
        ==================================
        1. UPLOAD VIDEO
        ==================================
      */

      setProgress(
        15,
        "Video ကို Server သို့ Upload လုပ်နေသည်..."
      );

      statusText.innerText =
        "📤 Video Upload လုပ်နေသည်...";

      const formData =
        new FormData();

      formData.append(
        "file",
        file
      );


      const uploadResponse =
        await fetch(
          API_BASE + "/upload",
          {
            method: "POST",
            body: formData
          }
        );


      if (!uploadResponse.ok) {

        const errorText =
          await uploadResponse.text();

        throw new Error(
          "Video upload မအောင်မြင်ပါ။ " +
          errorText
        );

      }


      const uploadData =
        await uploadResponse.json();

      const videoId =
        uploadData.video_id;


      if (!videoId) {

        throw new Error(
          "Server က video_id မပြန်ပါ။"
        );

      }


      console.log(
        "Video ID:",
        videoId
      );


      /*
        ==================================
        2. EXTRACT AUDIO
        ==================================
      */

      setProgress(
        35,
        "Audio ထုတ်နေသည်..."
      );

      statusText.innerText =
        "🎵 Video ထဲက Audio ကို ထုတ်နေသည်...";


      const audioResponse =
        await fetch(
          API_BASE +
          "/extract-audio/" +
          encodeURIComponent(videoId),
          {
            method: "POST"
          }
        );


      if (!audioResponse.ok) {

        const errorText =
          await audioResponse.text();

        throw new Error(
          "Audio extraction မအောင်မြင်ပါ။ " +
          errorText
        );

      }


      const audioData =
        await audioResponse.json();


      console.log(
        "Audio:",
        audioData
      );


      /*
        ==================================
        3. CREATE RECAP VIDEO
        ==================================
      */

      setProgress(
        60,
        "AI Recap Video ပြုလုပ်နေသည်..."
      );

      statusText.innerText =
        "🤖 AI က Recap Video ပြုလုပ်နေသည်...";


      const recapResponse =
        await fetch(
          API_BASE +
          "/create-recap/" +
          encodeURIComponent(videoId),
          {
            method: "POST"
          }
        );


      if (!recapResponse.ok) {

        const errorText =
          await recapResponse.text();

        throw new Error(
          "Recap Video ပြုလုပ်မရပါ။ " +
          errorText
        );

      }


      const recapData =
        await recapResponse.json();


      console.log(
        "Recap:",
        recapData
      );


      /*
        ==================================
        4. DOWNLOAD URL
        ==================================
      */

      setProgress(
        90,
        "Final Video ပြင်ဆင်နေသည်..."
      );

      statusText.innerText =
        "⏳ Final Video ကို ပြင်ဆင်နေသည်...";


      let downloadUrl = "";


      /*
        Backend က video_url ပြန်ရင်
        အဲဒီ URL ကိုသုံးမယ်။
      */

      if (recapData.video_url) {

        downloadUrl =
          recapData.video_url;

      }

      /*
        Backend က download_url ပြန်ရင်
        အဲဒီ URL ကိုသုံးမယ်။
      */

      else if (recapData.download_url) {

        downloadUrl =
          recapData.download_url;

      }

      /*
        URL မပြန်ရင် backend download route
        ကို တိုက်ရိုက်သုံးမယ်။
      */

      else {

        downloadUrl =
          API_BASE +
          "/download/" +
          encodeURIComponent(videoId);

      }


      /*
        Relative URL ဖြစ်ရင်
        Backend domain ထည့်ပေးမယ်။
      */

      if (
        downloadUrl.startsWith("/")
      ) {

        downloadUrl =
          API_BASE +
          downloadUrl;

      }


      console.log(
        "Download URL:",
        downloadUrl
      );


      /*
        ==================================
        COMPLETE
        ==================================
      */

      setProgress(
        100,
        "Recap Video ပြီးပါပြီ!"
      );

      statusText.innerText =
        "✅ Recap Video အောင်မြင်စွာ ပြီးပါပြီ။";


      /*
        DOWNLOAD BUTTON
      */

      downloadBtn.href =
        downloadUrl;

      downloadBtn.setAttribute(
        "download",
        "zero-recap.mp4"
      );


      result.style.display =
        "block";


      /*
        Scroll result into view
      */

      result.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });


    }

    catch (error) {

      console.error(
        "Recap Error:",
        error
      );


      statusText.classList.add(
        "error"
      );


      statusText.innerText =
        "❌ Error: " +
        error.message;


      setProgress(
        0,
        "လုပ်ဆောင်မှု မအောင်မြင်ပါ"
      );

    }

    finally {

      generateBtn.disabled =
        false;

    }

  }

</script>

</body>
</html>
