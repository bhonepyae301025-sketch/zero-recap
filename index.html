<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🚀 Zero Recap</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7fb;
      color: #222;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 35px auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 42px;
      margin: 0 0 8px;
      font-weight: 800;
    }

    .header p {
      margin: 0;
      color: #666;
      font-size: 20px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .upload-box {
      border: 3px dashed #aaa;
      border-radius: 22px;
      padding: 35px 20px;
      text-align: center;
    }

    .upload-box h2 {
      margin-top: 0;
    }

    input[type="file"] {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: white;
    }

    label {
      display: block;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    select {
      width: 100%;
      padding: 17px;
      border: 1px solid #ccc;
      border-radius: 15px;
      background: white;
      font-size: 17px;
    }

    .field {
      margin-bottom: 22px;
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 15px;
      background: #16833e;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      display: none;
      margin-top: 20px;
      padding: 17px;
      border-radius: 14px;
      background: #f0f4ff;
      text-align: center;
      font-size: 17px;
    }

    #progressBox {
      display: none;
      margin-top: 15px;
    }

    .progress-bg {
      width: 100%;
      height: 14px;
      background: #ddd;
      border-radius: 20px;
      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: #16833e;
      transition: width 0.3s;
    }

    #progressText {
      text-align: center;
      margin-top: 8px;
      font-weight: bold;
    }

    #result {
      display: none;
    }

    #resultVideo {
      display: none;
      width: 100%;
      margin-top: 15px;
      border-radius: 15px;
      background: #000;
    }

    #downloadBtn {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #16833e;
      color: white;
      padding: 16px;
      border-radius: 15px;
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .small {
      color: #777;
      font-size: 14px;
      text-align: center;
      margin-top: 10px;
    }

    .error {
      background: #ffeaea !important;
      color: #a00000;
    }

    .success {
      background: #eaffef !important;
      color: #08752c;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🚀 Zero Recap</h1>
      <p>Video ကို AI Recap ပြုလုပ်ပါ</p>
    </div>

    <div class="card">

      <div class="upload-box">
        <h2>🎬 Video ရွေးပါ</h2>

        <input
          type="file"
          id="videoFile"
          accept="video/*"
        >
      </div>

      <br>

      <div class="field">
        <label>🌐 ဘာသာစကား</label>

        <select id="language">
          <option value="my">🇲🇲 မြန်မာ</option>
          <option value="en">🇺🇸 English</option>
        </select>
      </div>

      <div class="field">
        <label>🎙️ အသံ</label>

        <select id="voice">
          <option value="female">👩 မိန်းကလေးအသံ</option>
          <option value="male">👨 ယောက်ျားလေးအသံ</option>
        </select>
      </div>

      <div class="field">
        <label>🎨 ပုံစံ</label>

        <select id="style">
          <option value="default">🗣️ သဘာဝပုံစံ</option>
          <option value="short">⚡ တိုတောင်းသော Recap</option>
          <option value="detailed">📖 အသေးစိတ် Recap</option>
        </select>
      </div>

      <button id="recapBtn">
        🚀 Recap Video ပြုလုပ်မည်
      </button>

      <div id="status"></div>

      <div id="progressBox">
        <div class="progress-bg">
          <div id="progressBar"></div>
        </div>

        <div id="progressText">0%</div>
      </div>

    </div>

    <div class="card" id="result">

      <h2>🎉 Recap ပြီးပါပြီ</h2>

      <p id="resultText">
        Recap Video ကို အောက်မှာကြည့်နိုင်ပြီး ရယူနိုင်ပါပြီ။
      </p>

      <video
        id="resultVideo"
        controls
        playsinline
      ></video>

      <a
        id="downloadBtn"
        href="#"
        download
      >
        ⬇️ Recap Video ရယူမည်
      </a>

    </div>

    <div class="small">
      Zero Recap
    </div>

  </div>


<script>

  // =====================================================
  // BACKEND URL
  // =====================================================

  const API_BASE = "https://zero-recap.onrender.com";


  // =====================================================
  // ELEMENTS
  // =====================================================

  const videoFile = document.getElementById("videoFile");
  const language = document.getElementById("language");
  const voice = document.getElementById("voice");
  const style = document.getElementById("style");

  const recapBtn = document.getElementById("recapBtn");

  const status = document.getElementById("status");

  const progressBox = document.getElementById("progressBox");
  const progressBar = document.getElementById("progressBar");
  const progressText = document.getElementById("progressText");

  const result = document.getElementById("result");
  const resultText = document.getElementById("resultText");

  const resultVideo = document.getElementById("resultVideo");
  const downloadBtn = document.getElementById("downloadBtn");


  // =====================================================
  // STATUS
  // =====================================================

  function showStatus(message, type = "") {

    status.style.display = "block";

    status.className = "";

    if (type === "error") {
      status.classList.add("error");
    }

    if (type === "success") {
      status.classList.add("success");
    }

    status.innerText = message;
  }


  // =====================================================
  // PROGRESS
  // =====================================================

  function setProgress(value, message = "") {

    value = Math.max(0, Math.min(100, value));

    progressBox.style.display = "block";

    progressBar.style.width = value + "%";

    progressText.innerText =
      Math.round(value) + "%" +
      (message ? " — " + message : "");
  }


  // =====================================================
  // RESET RESULT
  // =====================================================

  function resetResult() {

    result.style.display = "none";

    resultVideo.pause();

    resultVideo.removeAttribute("src");

    resultVideo.load();

    downloadBtn.removeAttribute("href");

    resultVideo.style.display = "none";
  }


  // =====================================================
  // MAIN
  // =====================================================

  recapBtn.addEventListener("click", async () => {

    resetResult();

    const file = videoFile.files[0];

    if (!file) {

      showStatus(
        "⚠️ Video ဖိုင်အရင်ရွေးပေးပါ။",
        "error"
      );

      return;
    }


    // Disable button

    recapBtn.disabled = true;

    recapBtn.innerText =
      "⏳ Processing...";


    try {

      // -------------------------------------------------
      // STEP 1 — UPLOAD
      // -------------------------------------------------

      setProgress(
        10,
        "Video Upload လုပ်နေပါတယ်..."
      );

      showStatus(
        "📤 Video Upload လုပ်နေပါတယ်..."
      );


      const formData = new FormData();

      formData.append(
        "file",
        file
      );


      const uploadResponse =
        await fetch(
          API_BASE + "/upload",
          {
            method: "POST",
            body: formData
          }
        );


      if (!uploadResponse.ok) {

        const errorText =
          await uploadResponse.text();

        throw new Error(
          "Upload failed: " +
          errorText
        );
      }


      const uploadData =
        await uploadResponse.json();


      if (!uploadData.video_id) {

        throw new Error(
          "Backend က video_id မပြန်ပေးပါ။"
        );
      }


      const videoId =
        uploadData.video_id;


      // -------------------------------------------------
      // STEP 2 — EXTRACT AUDIO
      // -------------------------------------------------

      setProgress(
        25,
        "Audio ထုတ်နေပါတယ်..."
      );

      showStatus(
        "🎵 Video ထဲက Audio ထုတ်နေပါတယ်..."
      );


      const audioResponse =
        await fetch(
          API_BASE +
          "/extract-audio/" +
          encodeURIComponent(videoId),
          {
            method: "POST"
          }
        );


      if (!audioResponse.ok) {

        const errorText =
          await audioResponse.text();

        throw new Error(
          "Audio extraction failed: " +
          errorText
        );
      }


      await audioResponse.json();


      // -------------------------------------------------
      // STEP 3 — CREATE RECAP
      // -------------------------------------------------

      setProgress(
        40,
        "Recap Video ပြုလုပ်နေပါတယ်..."
      );

      showStatus(
        "🎬 Recap Video ပြုလုပ်နေပါတယ်။ ခဏစောင့်ပေးပါ..."
      );


      const recapResponse =
        await fetch(
          API_BASE +
          "/create-recap/" +
          encodeURIComponent(videoId),
          {
            method: "POST"
          }
        );


      if (!recapResponse.ok) {

        const errorText =
          await recapResponse.text();

        throw new Error(
          "Recap creation failed: " +
          errorText
        );
      }


      const recapData =
        await recapResponse.json();


      // -------------------------------------------------
      // STEP 4 — WAIT / FINISH
      // -------------------------------------------------

      setProgress(
        90,
        "Recap Video ပြင်ဆင်နေပါတယ်..."
      );


      if (
        !recapData.video_url
      ) {

        throw new Error(
          "Backend က video_url မပြန်ပေးပါ။"
        );
      }


      // -------------------------------------------------
      // VIDEO URL
      // -------------------------------------------------

      const videoUrl =
        API_BASE +
        recapData.video_url;


      // Show video

      resultVideo.src =
        videoUrl;

      resultVideo.style.display =
        "block";


      // Download link

      downloadBtn.href =
        videoUrl;


      downloadBtn.download =
        "zero-recap.mp4";


      resultText.innerText =
        "Recap Video ကို အောက်မှာကြည့်နိုင်ပြီး ရယူနိုင်ပါပြီ။";


      // Show result

      result.style.display =
        "block";


      setProgress(
        100,
        "ပြီးပါပြီ!"
      );


      showStatus(
        "✅ Recap Video ပြီးပါပြီ။",
        "success"
      );


      // Scroll to result

      setTimeout(() => {

        result.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }, 300);


    } catch (error) {

      console.error(
        "Zero Recap Error:",
        error
      );


      showStatus(
        "❌ Error: " +
        (error.message || "Unknown error"),
        "error"
      );


      setProgress(
        0,
        "မအောင်မြင်ပါ"
      );


    } finally {

      recapBtn.disabled =
        false;

      recapBtn.innerText =
        "🚀 Recap Video ပြုလုပ်မည်";

    }

  });

</script>

</body>
</html>
